name: Remove inert legacy bundle from frontend graph

on:
  push:
    paths:
      - '.github/workflows/remove-legacy-bundle.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Remove legacy bundle registration and dependency
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('inc/assets.php')
          text = path.read_text(encoding='utf-8')

          replacements = (
              ("\t\t// Keep the remaining legacy dependency graph while Vaarta replaces\n\t\t// individual behaviors with small native modules.\n", "\t\t// Vendor libraries stay isolated behind the native Vaarta adapters that use them.\n"),
              ("\t\twp_register_script( 'csco-scripts', get_template_directory_uri() . '/assets/js/scripts.js', array( 'jquery', 'imagesloaded', 'flickity', 'colcade' ), $version, true );\n", ""),
              ("\t\t// Modular Vaarta runtime. The compiled bundle remains only for behaviors\n\t\t// that have not yet moved to native modules.\n", "\t\t// Modular Vaarta runtime. The old compiled bundle is retained in the repository\n\t\t// only as a compatibility/reference artifact and is no longer enqueued.\n"),
              ("wp_register_script( 'vaarta-runtime', get_template_directory_uri() . '/assets/js/modules/runtime.js', array( 'csco-scripts' ), $version, true );", "wp_register_script( 'vaarta-runtime', get_template_directory_uri() . '/assets/js/modules/runtime.js', array(), $version, true );"),
              ("\t\t\t'csco-scripts',\n", ""),
              ("wp_localize_script( 'csco-scripts', 'csLocalize', $localize );", "wp_localize_script( 'vaarta-runtime', 'csLocalize', $localize );"),
          )

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one assets target {old!r}, found {count}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          Path('.github/workflows/remove-legacy-bundle.yml').unlink()
          PY

      - name: Commit frontend graph cleanup
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add inc/assets.php .github/workflows/remove-legacy-bundle.yml
          git commit -m 'Runtime: stop enqueueing the inert legacy bundle'
          git push
