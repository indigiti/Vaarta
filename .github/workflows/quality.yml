name: Theme quality

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  php-lint:
    name: PHP ${{ matrix.php }} syntax
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php:
          - '8.1'
          - '8.2'
          - '8.3'
          - '8.4'
          - '8.5'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Lint PHP files
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file"
          done < <(find . -type f -name '*.php' -not -path './vendor/*' -print0)

  theme-json:
    name: Validate theme.json
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate JSON syntax and schema version
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('theme.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          if data.get('version') != 3:
              raise SystemExit('theme.json must use schema version 3')
          print('theme.json is valid and uses version 3')
          PY

  native-blocks:
    name: Validate native Vaarta blocks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate block metadata and scripts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          registry = Path('inc/vaarta-blocks.php').read_text(encoding='utf-8')
          functions = Path('functions.php').read_text(encoding='utf-8')

          if "'/inc/vaarta-blocks.php'" not in functions:
              raise SystemExit('functions.php must load inc/vaarta-blocks.php')

          block_names = set()
          block_dirs = sorted(path.parent for path in Path('blocks').glob('*/block.json'))
          if not block_dirs:
              raise SystemExit('No native Vaarta blocks found')

          for block_dir in block_dirs:
              metadata_path = block_dir / 'block.json'
              metadata = json.loads(metadata_path.read_text(encoding='utf-8'))
              name = metadata.get('name', '')

              if metadata.get('apiVersion') != 3:
                  raise SystemExit(f'{metadata_path}: apiVersion must be 3')
              if not name.startswith('vaarta/'):
                  raise SystemExit(f'{metadata_path}: block name must use vaarta/ namespace')
              if name in block_names:
                  raise SystemExit(f'Duplicate block name: {name}')
              block_names.add(name)

              slug = block_dir.name
              if f"'{slug}'" not in registry:
                  raise SystemExit(f'{metadata_path}: {slug} missing from Vaarta block registry')

              render = metadata.get('render')
              if render and render.startswith('file:./'):
                  target = block_dir / render.removeprefix('file:./')
                  if not target.is_file():
                      raise SystemExit(f'{metadata_path}: missing render file {target}')

              editor_script = metadata.get('editorScript')
              if editor_script and editor_script.startswith('file:./'):
                  target = block_dir / editor_script.removeprefix('file:./')
                  if not target.is_file():
                      raise SystemExit(f'{metadata_path}: missing editor script {target}')
                  asset = target.with_suffix('.asset.php')
                  if not asset.is_file():
                      raise SystemExit(f'{metadata_path}: missing dependency file {asset}')

          print(f'Validated {len(block_dirs)} native Vaarta blocks')
          PY

          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find blocks -type f -name '*.js' -print0)

  design-system-patterns:
    name: Validate Vaarta design system and patterns
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate token bridge and pattern headers
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          from pathlib import Path

          functions = Path('functions.php').read_text(encoding='utf-8')
          assets = Path('inc/assets.php').read_text(encoding='utf-8')
          editor_assets = Path('inc/gutenberg/assets.php').read_text(encoding='utf-8')
          bridge_path = Path('assets/css/vaarta-design-system.css')

          if "'/inc/vaarta-patterns.php'" not in functions:
              raise SystemExit('functions.php must load inc/vaarta-patterns.php')
          if not bridge_path.is_file():
              raise SystemExit('Missing Vaarta design-system bridge stylesheet')

          bridge = bridge_path.read_text(encoding='utf-8')
          required_tokens = (
              '--wp--preset--color--primary',
              '--wp--preset--color--accent',
              '--wp--style--global--content-size',
              '--wp--custom--vaarta--radius--image',
              '--cs-color-primary',
              '--cs-entry-content-width',
              '--cs-image-border-radius',
          )
          for token in required_tokens:
              if token not in bridge:
                  raise SystemExit(f'Design-system bridge missing token: {token}')

          if 'vaarta-design-system' not in assets:
              raise SystemExit('Frontend assets must enqueue the Vaarta design-system bridge')
          if 'assets/css/vaarta-design-system.css' not in editor_assets:
              raise SystemExit('Editor styles must load the Vaarta design-system bridge')

          pattern_paths = sorted(Path('patterns').glob('*.php'))
          if not pattern_paths:
              raise SystemExit('No Vaarta block patterns found')

          slugs = set()
          for path in pattern_paths:
              text = path.read_text(encoding='utf-8')
              title = re.search(r'^ \* Title:\s*(.+)$', text, re.MULTILINE)
              slug = re.search(r'^ \* Slug:\s*(\S+)$', text, re.MULTILINE)
              categories = re.search(r'^ \* Categories:\s*(.+)$', text, re.MULTILINE)

              if not title or not slug or not categories:
                  raise SystemExit(f'{path}: missing Title, Slug, or Categories header')
              if not slug.group(1).startswith('vaarta/'):
                  raise SystemExit(f'{path}: pattern slug must use vaarta/ namespace')
              if slug.group(1) in slugs:
                  raise SystemExit(f'Duplicate pattern slug: {slug.group(1)}')
              slugs.add(slug.group(1))
              if '<!-- wp:vaarta/' not in text:
                  raise SystemExit(f'{path}: pattern must use at least one native Vaarta block')

          print(f'Validated design-system bridge and {len(pattern_paths)} Vaarta patterns')
          PY

  site-chrome:
    name: Validate Vaarta site chrome
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate chrome assets and accessible markup
        shell: bash
        run: |
          set -euo pipefail
          node --check assets/js/vaarta-chrome.js
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find assets/js/modules -type f -name '*.js' -print0)

          python - <<'PY'
          from pathlib import Path

          functions = Path('functions.php').read_text(encoding='utf-8')
          assets = Path('inc/assets.php').read_text(encoding='utf-8')
          chrome_js = Path('assets/js/vaarta-chrome.js').read_text(encoding='utf-8')
          chrome_css = Path('assets/css/vaarta-chrome.css').read_text(encoding='utf-8')
          search = Path('template-parts/site-search.php').read_text(encoding='utf-8')
          offcanvas = Path('template-parts/offcanvas.php').read_text(encoding='utf-8')
          fullscreen = Path('template-parts/fullscreen-menu.php').read_text(encoding='utf-8')

          if "'/inc/vaarta-mega-menu.php'" not in functions:
              raise SystemExit('functions.php must load the hardened Vaarta mega-menu layer')
          if 'vaarta-chrome.js' not in assets or 'vaarta-chrome.css' not in assets:
              raise SystemExit('Frontend assets must load Vaarta chrome JS and CSS')

          modules = {
              'runtime': Path('assets/js/modules/runtime.js'),
              'search': Path('assets/js/modules/search.js'),
              'offcanvas': Path('assets/js/modules/offcanvas.js'),
              'fullscreen-nav': Path('assets/js/modules/fullscreen-nav.js'),
              'fullscreen': Path('assets/js/modules/fullscreen.js'),
              'scheme': Path('assets/js/modules/scheme.js'),
          }
          for name, path in modules.items():
              if not path.is_file():
                  raise SystemExit(f'Missing Vaarta chrome module: {name}')
              if f'assets/js/modules/{path.name}' not in assets:
                  raise SystemExit(f'inc/assets.php must register Vaarta chrome module: {name}')

          runtime = modules['runtime'].read_text(encoding='utf-8')
          required_runtime = (
              'detachLegacyChromeHandlers',
              ".cs-header__search-toggle, .cs-search__close",
              ".cs-header__offcanvas-toggle, .cs-site-overlay, .cs-offcanvas__toggle",
              ".cs-header__fullscreen-menu-toggle, .cs-fullscreen-menu__header-toggle",
              "off( 'click', '.cs-site-scheme-toggle' )",
              "off( 'mouseenter', '.cs-fullscreen-menu .menu-item' )",
              "off( 'mouseleave', '.cs-fullscreen-menu__nav-col, .cs-fullscreen-menu__nav-inner' )",
          )
          for token in required_runtime:
              if token not in runtime:
                  raise SystemExit(f'Vaarta runtime compatibility contract missing: {token}')

          fullscreen_nav = modules['fullscreen-nav'].read_text(encoding='utf-8')
          required_fullscreen_nav = (
              'window.vaartaFullscreenNav',
              'submenu-visible',
              'menu-item-expanded',
              'vaarta-fullscreen-submenu-toggle',
              "classList.add( 'visible' )",
          )
          for token in required_fullscreen_nav:
              if token not in fullscreen_nav:
                  raise SystemExit(f'Fullscreen navigation module missing behavior contract: {token}')

          if "array( 'csco-scripts' )" not in assets or "array( 'vaarta-runtime' )" not in assets:
              raise SystemExit('Vaarta chrome modules must load after the legacy bundle through dependencies')

          required_js = (
              "'Escape'",
              'aria-expanded',
              'aria-hidden',
              'cs-offcanvas-active',
              'cs-fullscreen-menu-active',
              'MutationObserver',
          )
          for token in required_js:
              if token not in chrome_js:
                  raise SystemExit(f'Vaarta chrome JS missing behavior contract: {token}')

          if ':focus-visible' not in chrome_css:
              raise SystemExit('Vaarta chrome CSS must provide keyboard-visible focus')

          markup_contracts = {
              'site search': (search, 'id="vaarta-site-search"', 'aria-live="polite"', 'type="button"'),
              'offcanvas': (offcanvas, 'id="vaarta-offcanvas"', 'role="dialog"', 'aria-modal="true"'),
              'fullscreen': (fullscreen, 'id="vaarta-fullscreen-menu"', 'role="dialog"', 'aria-modal="true"'),
          }
          for label, values in markup_contracts.items():
              text = values[0]
              for token in values[1:]:
                  if token not in text:
                      raise SystemExit(f'{label} markup missing contract: {token}')

          print('Vaarta modular site chrome and accessibility contracts are valid')
          PY

  security-regressions:
    name: Security regression checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check forbidden request patterns
        shell: bash
        run: |
          set -euo pipefail
          if grep -R --line-number --include='*.php' --exclude='class-theme-activation.php' "wp_set_current_user.*\$_POST" .; then
            echo 'Request-controlled user impersonation detected.'
            exit 1
          fi

          if grep -n "update_option( *['\"]caards_license_data['\"]" functions.php; then
            echo 'Forced legacy license state detected in functions.php.'
            exit 1
          fi

          python - <<'PY'
          from pathlib import Path

          functions = Path('functions.php').read_text(encoding='utf-8')
          mega = Path('inc/vaarta-mega-menu.php').read_text(encoding='utf-8')

          if "'/inc/vaarta-mega-menu.php'" not in functions:
              raise SystemExit('Hardened mega-menu compatibility layer is not loaded')

          required = (
              "remove_action( 'wp_ajax_nopriv_csco_reload_menu'",
              "current_user_can( 'edit_theme_options' )",
              "check_ajax_referer( 'vaarta_reload_menu', 'nonce' )",
              "'post_status'         => 'publish'",
              "'posts_per_page'      => $per_page",
          )
          for token in required:
              if token not in mega:
                  raise SystemExit(f'Mega-menu security contract missing: {token}')

          print('Mega-menu request boundary is hardened')
          PY

          echo 'Security regression checks passed.'