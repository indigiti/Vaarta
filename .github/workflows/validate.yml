name: Validate Vaarta

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: PHP syntax
        run: find . -type f -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l

      - name: JavaScript syntax
        run: |
          find . -type f -name '*.js' ! -name 'view.js' -not -path './node_modules/*' -print0 | xargs -0 -r -n1 node --check
          find . -type f -name 'view.js' -not -path './node_modules/*' -print0 | while IFS= read -r -d '' file; do
            echo "MODULE OK: $file"
            node --input-type=module --check < "$file"
          done

      - name: JSON syntax
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          ignored = {'.git', 'node_modules', 'vendor'}
          for path in Path('.').rglob('*.json'):
              if any(part in ignored for part in path.parts):
                  continue
              with path.open(encoding='utf-8') as handle:
                  json.load(handle)
              print(f'JSON OK: {path}')
          PY

      - name: Block asset references
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          asset_fields = (
              'editorScript',
              'editorStyle',
              'style',
              'viewStyle',
              'viewScript',
              'viewScriptModule',
              'render',
          )

          for manifest in Path('blocks').glob('*/block.json'):
              data = json.loads(manifest.read_text(encoding='utf-8'))

              if str(data.get('name', '')).startswith('vaarta/') and data.get('category') != 'vaarta':
                  raise SystemExit(f'Vaarta block must use the vaarta category: {manifest}')

              for field in asset_fields:
                  value = data.get(field)
                  if not value:
                      continue

                  values = value if isinstance(value, list) else [value]
                  for item in values:
                      if not isinstance(item, str) or not item.startswith('file:'):
                          continue
                      target = manifest.parent / item.removeprefix('file:')
                      if not target.is_file():
                          raise SystemExit(f'Missing {field} asset: {target}')

              print(f'BLOCK OK: {manifest}')
          PY

      - name: Gutenberg block markup JSON
        run: |
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          comment = re.compile(r'<!--\s+wp:[\w\/-]+(?:\s+(\{.*\}))?\s*\/?-->')

          paths = list(Path('templates').glob('*.html')) + list(Path('parts').glob('*.html')) + list(Path('patterns').glob('*.php'))

          for path in paths:
              for number, line in enumerate(path.read_text(encoding='utf-8').splitlines(), start=1):
                  if '<!-- wp:' not in line:
                      continue

                  match = comment.search(line)
                  if not match:
                      raise SystemExit(f'Invalid Gutenberg block comment: {path}:{number}')

                  attrs = match.group(1)
                  if attrs:
                      try:
                          json.loads(attrs)
                      except json.JSONDecodeError as error:
                          raise SystemExit(f'Invalid block attribute JSON: {path}:{number}: {error}')

              print(f'MARKUP OK: {path}')
          PY

      - name: Required block-theme files
        run: |
          test -f style.css
          test -f theme.json
          test -f templates/index.html


      - name: Release version consistency
        run: |
          THEME_VERSION="$(awk -F ': ' '/^Version:/ { print $2; exit }' style.css)"
          PACKAGE_VERSION="$(python3 -c 'import json; print(json.load(open("package.json"))["version"])')"
          echo "Theme version:   $THEME_VERSION"
          echo "Package version: $PACKAGE_VERSION"
          test "$THEME_VERSION" = "$PACKAGE_VERSION"

      - name: Package smoke test
        run: |
          bash tools/package-theme.sh
          ZIP_FILE="$(find build -maxdepth 1 -name 'vaarta-*.zip' -print -quit)"
          test -n "$ZIP_FILE"
          unzip -t "$ZIP_FILE"
          unzip -l "$ZIP_FILE" | grep 'vaarta/theme.json'
          unzip -l "$ZIP_FILE" | grep 'vaarta/templates/index.html'
          unzip -l "$ZIP_FILE" | grep 'vaarta/blocks/editorial-grid/block.json'
