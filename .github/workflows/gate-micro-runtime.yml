name: Gate migrated micro runtime modules

on:
  push:
    paths:
      - '.github/workflows/gate-micro-runtime.yml'

permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Gate migrated Webpack modules
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('assets/js/scripts.js')
          source = path.read_text(encoding='utf-8')
          replacements = {
              '__webpack_require__(5);': '/* Vaarta native metabar alignment owns legacy Webpack module 5. */',
              '__webpack_require__(8);': '/* Vaarta native tile hover owns legacy Webpack module 8. */',
              '__webpack_require__(15);': '/* Vaarta native player controls own legacy Webpack module 15. */',
              'module.exports = __webpack_require__(20);': '/* Vaarta native widget navigation owns legacy Webpack module 20. */\nmodule.exports = {};',
          }

          for old, new in replacements.items():
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one {old!r}, found {count}')
              source = source.replace(old, new, 1)

          path.write_text(source, encoding='utf-8')
          Path('.github/workflows/gate-micro-runtime.yml').unlink()
          PY

      - name: Commit runtime gates
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/js/scripts.js .github/workflows/gate-micro-runtime.yml
          git commit -m 'Runtime: gate legacy micro interaction modules'
          git push
