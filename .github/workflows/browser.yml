name: Browser smoke

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  chrome-runtime:
    name: WordPress chrome interactions
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package.json

      - name: Install test tooling
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start WordPress
        run: npm run wp-env -- start

      - name: Activate theme and seed chrome fixtures
        shell: bash
        run: |
          set -euo pipefail
          THEME_SLUG="$(basename "$GITHUB_WORKSPACE")"
          npm run wp-env -- run cli wp theme activate "$THEME_SLUG"
          npm run wp-env -- run cli wp eval-file "wp-content/themes/${THEME_SLUG}/tests/e2e/fixtures.php"

      - name: Run browser smoke tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop WordPress
        if: always()
        run: npm run wp-env -- stop
