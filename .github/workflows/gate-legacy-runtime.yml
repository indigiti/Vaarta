name: Gate migrated legacy runtime modules

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/gate-legacy-runtime.yml'

permissions:
  contents: write

jobs:
  patch-generated-bundle:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gate migrated Webpack entry modules
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('assets/js/scripts.js')
          text = path.read_text(encoding='utf-8')
          replacements = {
              '__webpack_require__(2);': '/* Vaarta native carousel owns legacy Webpack module 2. */',
              '__webpack_require__(13);': '/* Vaarta native navigation owns legacy Webpack module 13. */',
          }

          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one entry call {old!r}, found {count}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit generated bundle gate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/gate-legacy-runtime.yml
          git add assets/js/scripts.js
          git diff --cached --check
          git commit -m 'Runtime: gate legacy carousel and navigation modules'
          git push origin HEAD:main
