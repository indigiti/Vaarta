name: Fix Customizer sanitizer parity

on:
  push:
    paths:
      - '.github/workflows/fix-customizer-parity.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preserve legacy typography semantics
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('inc/vaarta-customizer-sanitizers.php')
          text = path.read_text(encoding='utf-8')

          old = "array( 'auto', 'inherit', 'initial', 'unset' )"
          new = "array( 'auto', 'normal', 'inherit', 'initial', 'unset' )"
          if text.count(old) != 1:
              raise SystemExit(f'Expected one dimension keyword target, found {text.count(old)}')
          text = text.replace(old, new, 1)

          old_variant = '''\t\t\tcase 'variant':\n\t\t\t\tif ( is_scalar( $candidate ) ) {\n\t\t\t\t\t$variant = strtolower( trim( (string) $candidate ) );\n\t\t\t\t\tif ( preg_match( '/^(?:regular|italic|[1-9]00(?:italic)?)$/', $variant ) ) {\n\t\t\t\t\t\t$output[ $key ] = $variant;\n\t\t\t\t\t}\n\t\t\t\t}\n\t\t\t\tbreak;'''
          new_variant = '''\t\t\tcase 'variant':\n\t\t\t\tif ( is_scalar( $candidate ) ) {\n\t\t\t\t\t$variant          = strtolower( trim( (string) $candidate ) );\n\t\t\t\t\t$allowed_variants = array();\n\n\t\t\t\t\tif ( $field && ! empty( $field['choices']['variant'] ) && is_array( $field['choices']['variant'] ) ) {\n\t\t\t\t\t\t$allowed_variants = array_map( 'strval', $field['choices']['variant'] );\n\t\t\t\t\t} elseif ( class_exists( 'CSCO_Customizer_Fonts' ) ) {\n\t\t\t\t\t\t$allowed_variants = array_keys( CSCO_Customizer_Fonts::get_all_variants() );\n\t\t\t\t\t}\n\n\t\t\t\t\tif ( in_array( $variant, $allowed_variants, true ) || ( empty( $allowed_variants ) && preg_match( '/^(?:regular|italic|[1-9]00(?:italic|bold|light)?)$/', $variant ) ) ) {\n\t\t\t\t\t\t$output[ $key ] = $variant;\n\t\t\t\t\t}\n\t\t\t\t}\n\t\t\t\tbreak;'''
          if text.count(old_variant) != 1:
              raise SystemExit(f'Expected one typography variant target, found {text.count(old_variant)}')
          text = text.replace(old_variant, new_variant, 1)

          color_case = "\t\t\tcase 'color':\n\t\t\t\t$color = vaarta_customize_sanitize_color_value( $candidate );"
          subsets_case = '''\t\t\tcase 'subsets':\n\t\t\t\tif ( is_array( $candidate ) ) {\n\t\t\t\t\t$subsets = array();\n\n\t\t\t\t\tforeach ( $candidate as $subset ) {\n\t\t\t\t\t\tif ( ! is_scalar( $subset ) ) {\n\t\t\t\t\t\t\tcontinue;\n\t\t\t\t\t\t}\n\n\t\t\t\t\t\t$subset = trim( (string) $subset );\n\t\t\t\t\t\tif ( ! preg_match( '/^[a-z0-9_-]+$/i', $subset ) ) {\n\t\t\t\t\t\t\tcontinue;\n\t\t\t\t\t\t}\n\n\t\t\t\t\t\t$subset = sanitize_key( $subset );\n\t\t\t\t\t\tif ( $subset && ! in_array( $subset, $subsets, true ) ) {\n\t\t\t\t\t\t\t$subsets[] = $subset;\n\t\t\t\t\t\t}\n\t\t\t\t\t}\n\n\t\t\t\t\tif ( $subsets ) {\n\t\t\t\t\t\t$output[ $key ] = $subsets;\n\t\t\t\t\t}\n\t\t\t\t}\n\t\t\t\tbreak;\n\n'''
          if text.count(color_case) != 1:
              raise SystemExit(f'Expected one typography color target, found {text.count(color_case)}')
          text = text.replace(color_case, subsets_case + color_case, 1)

          path.write_text(text, encoding='utf-8')
          Path('.github/workflows/fix-customizer-parity.yml').unlink()
          PY

      - name: Commit parity fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add inc/vaarta-customizer-sanitizers.php .github/workflows/fix-customizer-parity.yml
          git commit -m 'Customizer: preserve typography subsets and normal spacing'
          git push
