name: Gate heavy legacy runtime modules

on:
  push:
    paths:
      - '.github/workflows/gate-heavy-runtime.yml'

permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Gate legacy Webpack modules 18 and 19
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('assets/js/scripts.js')
          source = path.read_text(encoding='utf-8')
          replacements = {
              '__webpack_require__(18);': '/* Vaarta native sticky sidebar owns legacy Webpack module 18. */',
              '__webpack_require__(19);': '/* Vaarta native video background owns legacy Webpack module 19. */',
          }
          for old, new in replacements.items():
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one {old!r}, found {count}')
              source = source.replace(old, new, 1)
          path.write_text(source, encoding='utf-8')
          Path('.github/workflows/gate-heavy-runtime.yml').unlink()
          PY

      - name: Commit runtime gates
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/js/scripts.js .github/workflows/gate-heavy-runtime.yml
          git commit -m 'Runtime: gate sticky sidebar and video modules'
          git push
