name: WordPress Integration Smoke

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clean-install:
    name: WordPress ${{ matrix.wordpress }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        wordpress:
          - '6.8.10'
          - '7.1.2'

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
          MYSQL_USER: wordpress
          MYSQL_PASSWORD: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout Vaarta
        uses: actions/checkout@v4

      - name: Set up PHP and WP-CLI
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mysqli, gd
          coverage: none
          tools: wp-cli

      - name: Build installable theme ZIP
        run: bash tools/package-theme.sh

      - name: Download WordPress
        run: |
          wp core download \
            --version="${{ matrix.wordpress }}" \
            --path=wp \
            --force

      - name: Configure WordPress
        run: |
          wp config create \
            --path=wp \
            --dbname=wordpress \
            --dbuser=wordpress \
            --dbpass=wordpress \
            --dbhost=127.0.0.1:3306 \
            --skip-check

          wp db check --path=wp

      - name: Install clean WordPress site
        run: |
          wp core install \
            --path=wp \
            --url=http://127.0.0.1:8080 \
            --title="Vaarta Integration" \
            --admin_user=admin \
            --admin_password="vaarta-integration-password" \
            --admin_email=admin@example.com \
            --skip-email

      - name: Install packaged Vaarta ZIP
        run: |
          ZIP_FILE="$(find build -maxdepth 1 -name 'vaarta-*.zip' -print -quit)"
          test -n "$ZIP_FILE"

          wp theme install "$ZIP_FILE" \
            --path=wp \
            --activate

          test "$(wp theme get vaarta --field=status --path=wp)" = "active"

      - name: Configure pretty permalinks
        run: |
          wp rewrite structure '/%postname%/' --path=wp
          wp rewrite flush --hard --path=wp

      - name: Bootstrap Vaarta demo site from installed package
        run: |
          wp eval-file \
            wp/wp-content/themes/vaarta/tools/setup-demo-site.php \
            --path=wp

      - name: Verify registered editorial system
        run: |
          wp eval '
            $registry = WP_Block_Type_Registry::get_instance();
            $required = array(
              "vaarta/editorial-grid",
              "vaarta/story-meta",
              "vaarta/category-cards",
              "vaarta/contact-form",
              "vaarta/team-grid",
              "vaarta/search-overlay",
              "vaarta/auto-load-posts"
            );

            foreach ( $required as $name ) {
              if ( ! $registry->is_registered( $name ) ) {
                fwrite( STDERR, "Missing block: {$name}\n" );
                exit( 1 );
              }
            }

            echo "Required Vaarta blocks registered.\n";
          ' --path=wp

          wp eval '
            $theme = wp_get_theme();
            if ( "Vaarta" !== $theme->get( "Name" ) ) {
              fwrite( STDERR, "Unexpected active theme.\n" );
              exit( 1 );
            }

            $templates = $theme->get_page_templates( null, "page" );
            foreach ( array( "page-contact.php", "page-team.php", "page-coming-soon.php" ) as $template ) {
              // Block-theme templates are exposed differently across Core versions,
              // so runtime page assignment is verified through seeded page meta below.
            }

            echo "Active theme: " . $theme->get( "Name" ) . " " . $theme->get( "Version" ) . "\n";
          ' --path=wp

          test "$(wp post meta get "$(wp post list --post_type=page --name=contact --field=ID --path=wp)" _wp_page_template --path=wp)" = "page-contact"
          test "$(wp post meta get "$(wp post list --post_type=page --name=team --field=ID --path=wp)" _wp_page_template --path=wp)" = "page-team"
          test "$(wp post meta get "$(wp post list --post_type=page --name=coming-soon --field=ID --path=wp)" _wp_page_template --path=wp)" = "page-coming-soon"

      - name: Start WordPress web server
        run: |
          wp server \
            --path=wp \
            --host=127.0.0.1 \
            --port=8080 \
            > /tmp/vaarta-wp-server.log 2>&1 &

          echo $! > /tmp/vaarta-wp-server.pid

          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:8080/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done

          cat /tmp/vaarta-wp-server.log
          exit 1

      - name: Verify frontend routes
        run: |
          routes=(
            /
            /firmware/
            /datacrunch/
            /foundr/
            /artboard/
            /design-loft/
            /blog/
            /contact/
            /team/
            /coming-soon/
          )

          for route in "${routes[@]}"; do
            echo "Checking $route"
            body="$(curl -fsS "http://127.0.0.1:8080$route")"
            test -n "$body"

            if grep -qi 'There has been a critical error' <<< "$body"; then
              echo "Critical WordPress error rendered at $route" >&2
              exit 1
            fi
          done

      - name: Verify Vaarta REST routes
        run: |
          curl -fsS 'http://127.0.0.1:8080/wp-json/vaarta/v1/search?q=AI&limit=3' \
            | python3 -c 'import json,sys; data=json.load(sys.stdin); assert "results" in data'

          status="$(
            curl -sS -o /tmp/contact-response.json -w '%{http_code}' \
              -H 'Content-Type: application/json' \
              -d '{"name":"","email":"invalid","message":""}' \
              'http://127.0.0.1:8080/wp-json/vaarta/v1/contact'
          )"

          test "$status" = "400"

      - name: Show server log on failure
        if: failure()
        run: cat /tmp/vaarta-wp-server.log || true
