name: Move runtime config to native Vaarta handles

on:
  push:
    paths:
      - '.github/workflows/move-native-config.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Move localized globals to native script handles
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path('inc/load-more.php'): (
                  "wp_localize_script( 'csco-scripts', 'csco_ajax_pagination', $args );",
                  "wp_localize_script( 'vaarta-load-more', 'csco_ajax_pagination', $args );",
              ),
              Path('inc/load-nextpost.php'): (
                  "wp_localize_script( 'csco-scripts', 'csco_ajax_nextpost', $args );",
                  "wp_localize_script( 'vaarta-continuous-reading', 'csco_ajax_nextpost', $args );",
              ),
              Path('inc/mega-menu.php'): (
                  "wp_localize_script( 'csco-scripts', 'csco_mega_menu', $args );",
                  "wp_localize_script( 'vaarta-mega-menu', 'csco_mega_menu', $args );",
              ),
          }

          for path, (old, new) in replacements.items():
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one localization target, found {count}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          Path('.github/workflows/move-native-config.yml').unlink()
          PY

      - name: Commit native config handoff
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add inc/load-more.php inc/load-nextpost.php inc/mega-menu.php .github/workflows/move-native-config.yml
          git commit -m 'Runtime: localize config onto native Vaarta handles'
          git push
