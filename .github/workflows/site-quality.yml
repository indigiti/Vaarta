name: Site Quality Audit

on:
  workflow_dispatch:
    inputs:
      site_url:
        description: 'Public WordPress URL running Vaarta'
        required: true
        type: string
      paths:
        description: 'Comma-separated accessibility paths, e.g. /,/category/news/,/sample-article/'
        required: false
        default: '/'
        type: string
      lighthouse_urls:
        description: 'Comma-separated absolute URLs for Lighthouse'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install quality tooling
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Accessibility smoke
        env:
          VAARTA_BASE_URL: ${{ inputs.site_url }}
          VAARTA_A11Y_PATHS: ${{ inputs.paths }}
        run: npm run test:a11y

      - name: Lighthouse budgets
        env:
          VAARTA_BASE_URL: ${{ inputs.site_url }}
          LHCI_TARGET_URLS: ${{ inputs.lighthouse_urls != '' && inputs.lighthouse_urls || inputs.site_url }}
        run: npm run audit:lighthouse
