name: Gate migrated data runtime modules

on:
  push:
    paths:
      - '.github/workflows/gate-data-runtime.yml'

permissions:
  contents: write

jobs:
  patch-generated-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Gate migrated Webpack modules and decouple Colcade
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          bundle_path = Path('assets/js/scripts.js')
          bundle = bundle_path.read_text()
          replacements = {
              '__webpack_require__(9);': '/* Vaarta native load-more owns legacy Webpack module 9. */',
              '__webpack_require__(11);': '/* Vaarta native masonry owns legacy Webpack module 11. */',
          }
          for old, new in replacements.items():
              count = bundle.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one {old!r}, found {count}')
              bundle = bundle.replace(old, new, 1)
          bundle_path.write_text(bundle)

          assets_path = Path('inc/assets.php')
          assets = assets_path.read_text()
          old = "wp_register_script( 'colcade', get_template_directory_uri() . '/assets/vendor/colcade.js', array( 'jquery' ), $version, true );"
          new = "wp_register_script( 'colcade', get_template_directory_uri() . '/assets/vendor/colcade.js', array(), $version, true );"
          count = assets.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one Colcade dependency line, found {count}')
          assets_path.write_text(assets.replace(old, new, 1))

          Path('.github/workflows/gate-data-runtime.yml').unlink()
          PY

      - name: Commit runtime gates
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/js/scripts.js inc/assets.php .github/workflows/gate-data-runtime.yml
          git commit -m 'Runtime: gate legacy load-more and masonry modules'
          git push
