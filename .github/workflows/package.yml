name: Package Vaarta

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build installable ZIP
        run: bash tools/package-theme.sh

      - name: Upload theme artifact
        uses: actions/upload-artifact@v4
        with:
          name: vaarta-theme
          path: build/vaarta-*.zip
          if-no-files-found: error

      - name: Create tagged GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" build/vaarta-*.zip \
            --title "Vaarta ${GITHUB_REF_NAME}" \
            --generate-notes
