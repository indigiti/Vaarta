name: Package Vaarta

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify tag matches theme version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION="$(awk -F ': ' '/^Version:/ { print $2; exit }' style.css)"
          test "${GITHUB_REF_NAME}" = "v${VERSION}"

      - name: Build installable ZIP
        run: bash tools/package-theme.sh

      - name: Upload theme artifact
        uses: actions/upload-artifact@v4
        with:
          name: vaarta-theme
          path: build/vaarta-*.zip
          if-no-files-found: error

      - name: Create or update tagged GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" build/vaarta-*.zip --clobber
          else
            gh release create "${GITHUB_REF_NAME}" build/vaarta-*.zip \
              --title "Vaarta ${GITHUB_REF_NAME}" \
              --generate-notes
          fi
